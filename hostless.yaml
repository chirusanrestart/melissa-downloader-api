build:
  command: ""
  system: docker
  min_cpu: 0.01
  max_cpu: 0.5
  min_memory: 128
  max_memory: 1024
dockerfile_path: ./Dockerfile
working_directory: /
post_build_command: ""
start_command: npm start
scaling:
  trigger: http_requests
  min_cpu: 0.01
  max_cpu: 0.5
  min_memory: 128
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 30
health_check:
  type: http
  interval_in_seconds: 30
  http_path: /health
cron_jobs: []
workers: []
review_apps:
  enabled: false
  ttl_days: 7
  inherit_worker_processes: true
  inherit_cron_jobs: true
