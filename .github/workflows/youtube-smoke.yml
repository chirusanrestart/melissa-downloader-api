name: YouTube smoke test

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - ".github/workflows/youtube-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  youtube-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install extractor without pip cache
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Extract a temporary MP4 URL from a public YouTube video
        run: |
          python - <<'PY'
          from app import extract_direct_url

          result = extract_direct_url("https://www.youtube.com/watch?v=aqz-KE-bpKQ")
          assert result.get("url", "").startswith("http"), "No direct media URL returned"
          print("YouTube extraction succeeded")
          print("Direct URL: present (not printed because it may expire)")
          PY
