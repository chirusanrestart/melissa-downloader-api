name: Enviar servidor para o Hugging Face

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-huggingface-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do GitHub
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validar token do Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::O segredo HF_TOKEN não está configurado nas Secrets do repositório."
            exit 1
          fi

      - name: Clonar repositório do Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://huggingface.co/spaces/melissanina/melissa-downloader-api /tmp/hf-space
          rsync -av --delete             --exclude='.git/'             --exclude='.env'             --exclude='.env.*'             --exclude='auth/'             --exclude='secrets/'             --exclude='.cache/'             --exclude='__pycache__/'             --exclude='.pytest_cache/'             --exclude='.venv/'             --exclude='venv/'             --exclude='.github/'             ./ /tmp/hf-space/

      - name: Commit e enviar para o Hugging Face
        working-directory: /tmp/hf-space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para enviar ao Space."
            exit 0
          fi
          git commit -m "Deploy from GitHub Actions"
          git remote set-url origin "https://user:$HF_TOKEN@huggingface.co/spaces/melissanina/melissa-downloader-api"
          git push origin HEAD:main
