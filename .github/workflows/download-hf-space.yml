name: Sincronizar Space do Hugging Face para o GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-space:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório do GitHub
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar CLI do Hugging Face
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Baixar arquivos do Space
        run: |
          hf download melissanina/melissa-downloader-api \
            --repo-type=space \
            --local-dir /tmp/melissa-hf-space

      - name: Copiar código para o repositório
        run: |
          rsync -av /tmp/melissa-hf-space/ ./ \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='auth/' \
            --exclude='secrets/' \
            --exclude='.cache/' \
            --exclude='.github/workflows/download-hf-space.yml'

      - name: Salvar alterações no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para enviar."
          else
            git commit -m "Sincroniza código do Hugging Face Space"
            git push origin HEAD:main
          fi
