name: TikTok and Instagram smoke tests

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - ".github/workflows/social-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tiktok-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install extractor without pip cache
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Test TikTok direct URL extraction
        env:
          TEST_URL: https://vm.tiktok.com/ZSgyU8gBT/
        run: |
          python - <<'PY'
          import os
          from app import extract_direct_url

          result = extract_direct_url(os.environ["TEST_URL"])
          assert result.get("url", "").startswith(("https://", "http://")), "No direct media URL returned"
          print("TikTok extraction succeeded")
          print("Direct URL: present (not printed because it may expire)")
          PY

  instagram-extraction:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install extractor without pip cache
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Test Instagram Reel direct URL extraction
        env:
          TEST_URL: https://www.instagram.com/reel/DYAGGBqApLn/?srtk=YXR5emhmYnZhOGtl
        run: |
          python - <<'PY'
          import os
          from app import extract_direct_url

          result = extract_direct_url(os.environ["TEST_URL"])
          assert result.get("url", "").startswith(("https://", "http://")), "No direct media URL returned"
          print("Instagram extraction succeeded")
          print("Direct URL: present (not printed because it may expire)")
          PY
